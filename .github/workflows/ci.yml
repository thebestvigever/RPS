name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # A quick read on balance for every change. 40 games carries far too much
  # noise to be a verdict, so it only fails on something badly broken; the real
  # guard is the scheduled job in balance.yml.
  balance-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [original, corner2x2, neutrals]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sim --variant ${{ matrix.variant }} --blue medium --red medium --games 40 --seed 1
